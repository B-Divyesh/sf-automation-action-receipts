[package]
name = "action-receipts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Portable, signed receipts for automated actions"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-automation-action-receipts"
readme = "README.md"
keywords = ["audit", "automation", "provenance", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "action-receipts"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
